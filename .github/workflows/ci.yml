name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_DISABLE_TURBOPACK: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Disable Next.js Telemetry
        run: npx next telemetry disable

      - name: Diagnostics
        run: |
          node --version
          npm --version
          npx next --version
          npx tsc --version

      - name: Build Application
        run: |
          npm run build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "### Build Log (last 150 lines)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ $BUILD_EXIT -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -Ei "error TS|error:|Syntax error|Cannot find|Module not found|Failed to compile|ReferenceError|TypeError|SyntaxError" build.log | head -n 15)
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: build.log
